# 推送到 main 后，通知 Read the Docs 分别构建中文、英文两个项目。
# 密钥在密钥仓库，不写进本仓库。
main:
  push:
    - name: trigger-readthedocs
      docker:
        image: node:22
      lock:
        key: rtd-trigger
        wait: true
        cancel-in-wait: true
        timeout: 300
        expires: 600
      stages:
        - name: 触发中文文档构建
          imports:
            - https://cnb.cool/aithinker/aithinker-combo-guide-build/-/blob/main/rtd.yml
          script: |
            trigger() {
              name="$1"
              url="$2"
              token="$3"
              echo "正在触发 ${name}"
              code=$(curl -sS -o rtd-body.txt -w "%{http_code}" -X POST "$url" \
                --data-urlencode "branches=${RTD_BRANCH}" \
                --data-urlencode "default_branch=${RTD_BRANCH}" \
                --data-urlencode "token=${token}")
              echo "HTTP ${code}"
              cat rtd-body.txt
              echo
              if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
                echo "${name} 触发失败"
                exit 1
              fi
            }
            trigger "中文文档 aithinker-combo-guide" "$RTD_ZH_URL" "$RTD_ZH_TOKEN"
